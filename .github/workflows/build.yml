name: Build calculator app

# A release build: only a pushed v* tag (or a GitHub Release published for one) builds, tests,
# attaches microcas-<tag>.zip to that tag's Release and updates the website (docs/HOSTING.md).
# workflow_dispatch builds any ref; it releases and publishes only when run on a v* tag.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One run per tag at a time: a tag push and the Release published for it queue behind each
# other instead of racing, and the later one finds the ZIP already attached (check job).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Skip a Release already built by its tag push
    # A Release published for a tag that does not start with v builds nothing (every later
    # job needs this one).
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Look for this tag's calculator ZIP
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ] &&
             gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
             grep -qx "microcas-$TAG.zip"; then
            echo "microcas-$TAG.zip is already attached (the tag push built it); nothing to do."
            echo build=false >> "$GITHUB_OUTPUT"
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Test and package calculator app
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Full commit pins verified against the official actions/* Git refs API.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check device subset and frame levels
        run: |
          python tests/support/lint.py src
          python tests/support/framelint.py

      - name: Run source acceptance tests
        run: python -m pytest -q -m 'not slow' --strict-depth

      - name: Build the packed calculator release
        run: python build/release.py

      - name: Enforce TI Connect Evo per-program transfer limits
        # Only the launcher is transferred as source; packs ship compiled. The developer
        # probe dist/dev/CVTEST.py (CI only, never shipped) is held to the same limit.
        run: python build/transfer.py dist/CAS.py dist/dev/CVTEST.py

      - name: Run bundled acceptance tests
        run: python -m pytest -q -m 'not slow' --strict-depth --bundled

      - name: Build pinned native MicroPython for compatibility checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-multilib
          git init "$RUNNER_TEMP/micropython"
          git -C "$RUNNER_TEMP/micropython" remote add origin https://github.com/micropython/micropython.git
          git -C "$RUNNER_TEMP/micropython" fetch --depth 1 origin 0fd6c573ea815774668bbb16b8e197c8822368b2
          git -C "$RUNNER_TEMP/micropython" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/micropython/ports/unix" -j2 VARIANT=standard MICROPY_PY_SSL=0 MICROPY_PY_BTREE=0 MICROPY_PY_FFI=0 FROZEN_MANIFEST=

      - name: Check source packs in modern native MicroPython with 500000-byte heap
        # Compatibility with current MicroPython. The calculator runs the compiled archive
        # checked below; compiling the pack sources at run time is a desktop-only path.
        run: python build/micro_smoke.py --run "$RUNNER_TEMP/micropython/ports/unix/build-standard/micropython" --heap 500000

      - name: Prepare downloadable files
        run: |
          test -s dist/CAS.py
          test -s dist/dev/CVTEST.py
          test -s dist/release.json
          test -s dist/SHA256SUMS

      - name: Build pinned EVO bytecode compiler and compatible native runtimes
        run: |
          git init "$RUNNER_TEMP/evo-micropython"
          git -C "$RUNNER_TEMP/evo-micropython" remote add origin https://github.com/micropython/micropython.git
          git -C "$RUNNER_TEMP/evo-micropython" fetch --depth 1 origin 1f371947309c5ea6023b6d9065415697cbc75578
          git -C "$RUNNER_TEMP/evo-micropython" checkout --detach FETCH_HEAD
          # Use portable exception handling with modern GCC; large-file stat is
          # necessary for 32-bit Linux hosts with 64-bit filesystem inode IDs.
          make -C "$RUNNER_TEMP/evo-micropython/mpy-cross" -j2 CFLAGS_EXTRA="-Wno-error -DMICROPY_NLR_SETJMP=1"
          make -C "$RUNNER_TEMP/evo-micropython/ports/unix" -j2 BUILD=build-cas64 PROG=micropython-cas64 MICROPY_PY_USSL=0 MICROPY_PY_BTREE=0 MICROPY_PY_FFI=0 FROZEN_MANIFEST= CFLAGS_EXTRA="-Wno-error -DMICROPY_NLR_SETJMP=1 -D_FILE_OFFSET_BITS=64"
          make -C "$RUNNER_TEMP/evo-micropython/ports/unix" -j2 BUILD=build-cas32 PROG=micropython-cas32 CC="gcc -m32" MICROPY_PY_USSL=0 MICROPY_PY_BTREE=0 MICROPY_PY_FFI=0 FROZEN_MANIFEST= CFLAGS_EXTRA="-Wno-error -DMICROPY_NLR_SETJMP=1 -D_FILE_OFFSET_BITS=64"

      - name: Compile the library packs
        run: python build/archive.py --mpy-cross "$RUNNER_TEMP/evo-micropython/mpy-cross/mpy-cross"

      - name: Check pack behavior, eviction and depth on the compiler inputs
        run: python -m pytest -q tests/test_archive_release.py --strict-depth

      - name: Start the engine on a 95000-byte 32-bit heap
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas32" --heap 95000 --suite startup

      - name: Run a typical session on a 173360-byte 32-bit heap
        # 173360 bytes were free after a probe imported ti_plotlib, ti_graphics and more.
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas32" --heap 173360 --suite ui

      - name: Keep long MathPrint lines 2D after a result on a 173360-byte 32-bit heap
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas32" --heap 173360 --suite ui_edit

      - name: Run the heavy calculus session at the measured EVO start heap
        # PROBE3 measured 185296 bytes free at program start; the harness itself uses 4480.
        # docs/notes/FASTBOOT.md records why packs need more heap than v1 for these cases.
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas32" --heap 189776 --suite ui_calculus

      - name: Run the heavy calculus session 4 KiB under the measured EVO start heap
        # A pass at the nominal heap alone could be luck: native heap layout varies with the
        # run's path, so the gate keeps 4096 bytes of margin (docs/notes/MATHPRINT.md 0.8).
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas32" --heap 185680 --suite ui_calculus

      - name: Run the 55-case diagnostic stress session (developer CVTEST) on a 212000-byte 32-bit heap
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas32" --heap 212000 --suite probe

      - name: Check actual EVO bytecode on a 500000-byte 64-bit heap
        run: python build/micro_smoke.py --archive dist/archive --output dist/archive-smoke --run "$RUNNER_TEMP/evo-micropython/ports/unix/micropython-cas64" --heap 500000

      - name: Convert and round-trip every EVO transfer object
        run: |
          node build/package_archive.mjs
          python build/archive_zip.py

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Check installer and build the self-contained website
        run: |
          node --test website/tests/*.test.js
          python build/website.py
          python build/check_pages.py dist/website

      - name: Upload local web installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microcas-web-installer
          path: |
            dist/website/
            dist/serve_installer.py
            dist/START-INSTALLER.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload calculator app and documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microcas-calculator
          path: |
            dist/microcas-calculator.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach the calculator ZIP to the tag's GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's tested calculator ZIP
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: microcas-calculator
          path: dist

      - name: Create the Release if missing and upload microcas-<tag>.zip
        # A Release created in the GitHub UI is used as it is; a Release this token creates
        # starts no further workflow run.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/microcas-calculator.zip "microcas-$TAG.zip"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MicroCAS $TAG" \
              --notes "Calculator package for the TI-84 EVO: unzip microcas-$TAG.zip and follow INSTALL.md, or use the web installer." ||
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release upload "$TAG" "microcas-$TAG.zip" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Update website deployment branch
    needs: build
    # Cloudflare Workers watches pages. Only successful v* tag builds may update it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The narrowly scoped publish job needs this credential for git push.
          persist-credentials: true

      - name: Download this run's tested installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: microcas-web-installer
          path: dist/pages

      - name: Publish the tested website to pages
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 build/publish_site.py dist/pages/website --run-url "$RUN_URL" --ref "$GITHUB_REF"
