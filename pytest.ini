[pytest]
# cas-evo test suite (DESIGN.md section 20). Run from the repo root:
#   .venv/Scripts/python -m pytest -q
#   .venv/Scripts/python -m pytest -q -m "not slow"
# tests/ has no __init__.py: test file basenames must be unique. tests/conftest.py puts
# src/, shim/ and tests/support on sys.path and runs every test under the depth checker.
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers -p pytester
xfail_strict = true
